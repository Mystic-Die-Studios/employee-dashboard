---
# cPanel > Git Version Control > Manage > Pull or Deploy > Deploy HEAD Commit.
# The real work lives in deploy/cpanel_deploy.sh so it can also be run by hand
# from the cPanel Terminal.
deployment:
  tasks:
    # Must match the Application root in cPanel > Setup Python App.
    - export APPROOT="$HOME/contractor-dashboard"
    - /bin/bash deploy/cpanel_deploy.sh
